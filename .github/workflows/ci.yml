name: ChatBot CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check responses.yml exists
        shell: pwsh
        run: |
          if (Test-Path "responses.yml") {
            Write-Host "responses.yml found!"
          } else {
            Write-Error "responses.yml is MISSING!"
            exit 1
          }
